<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Critical Path Optimization Playback</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
  color: #111;
}
.wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}
h1 {
  margin-top: 0;
}
.controls {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
button {
  padding: 8px 14px;
  cursor: pointer;
}
input[type=range] {
  flex: 1 1 300px;
}
.viewer {
  background: white;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.meta {
  margin-bottom: 12px;
}
.meta .title {
  font-size: 22px;
  font-weight: bold;
}
.meta .desc {
  margin-top: 8px;
  line-height: 1.4;
}
img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 0 auto;
  border: 1px solid #ccc;
}
.footer {
  margin-top: 14px;
  color: #444;
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Critical Path Optimization Playback</h1>
  <div class="controls">
    <button onclick="prevStep()">Prev</button>
    <button onclick="togglePlay()" id="playBtn">Play</button>
    <button onclick="nextStep()">Next</button>
    <label>Speed
      <select id="speedSel" onchange="updateSpeed()">
        <option value="2000">0.5x</option>
        <option value="1200" selected>1x</option>
        <option value="700">1.7x</option>
        <option value="400">3x</option>
      </select>
    </label>
    <input id="slider" type="range" min="0" max="14" value="0" oninput="setStep(parseInt(this.value))">
  </div>
  <div class="viewer">
    <div class="meta">
      <div id="stepLabel"></div>
      <div class="title" id="title"></div>
      <div class="desc" id="desc"></div>
    </div>
    <img id="img" src="" alt="Playback step">
    <div class="footer">Use Left/Right arrow keys to navigate.</div>
  </div>
</div>
<script>
const steps = [
  {
    "step_index": 1,
    "title": "Top critical path overview",
    "description": "Top-ranked critical paths plotted in tile space with their original bounding boxes.",
    "figure_path": "figures/step_1_top_paths_overview.png"
  },
  {
    "step_index": 2,
    "title": "Spread score ranking",
    "description": "Bar chart of the path selection score used to choose local-clustering candidates.",
    "figure_path": "figures/step_1b_path_scores.png"
  },
  {
    "step_index": 3,
    "title": "Path detail rank 1",
    "description": "Ordered path geometry for selected path 26.",
    "figure_path": "figures/step_1c_path_1_detail.png"
  },
  {
    "step_index": 4,
    "title": "Path detail rank 2",
    "description": "Ordered path geometry for selected path 30.",
    "figure_path": "figures/step_1c_path_2_detail.png"
  },
  {
    "step_index": 5,
    "title": "Path detail rank 3",
    "description": "Ordered path geometry for selected path 16.",
    "figure_path": "figures/step_1c_path_3_detail.png"
  },
  {
    "step_index": 6,
    "title": "Path detail rank 4",
    "description": "Ordered path geometry for selected path 11.",
    "figure_path": "figures/step_1c_path_4_detail.png"
  },
  {
    "step_index": 7,
    "title": "Path detail rank 5",
    "description": "Ordered path geometry for selected path 7.",
    "figure_path": "figures/step_1c_path_5_detail.png"
  },
  {
    "step_index": 101,
    "title": "Candidate 1 region",
    "description": "Local pblock built around path 26; result WNS=0.097.",
    "figure_path": "figures/step_2_candidate_1_region.png"
  },
  {
    "step_index": 102,
    "title": "Candidate 2 region",
    "description": "Local pblock built around path 30; result WNS=0.115.",
    "figure_path": "figures/step_2_candidate_2_region.png"
  },
  {
    "step_index": 103,
    "title": "Candidate 3 region",
    "description": "Local pblock built around path 16; result WNS=0.084.",
    "figure_path": "figures/step_2_candidate_3_region.png"
  },
  {
    "step_index": 104,
    "title": "Candidate 4 region",
    "description": "Local pblock built around path 11; result WNS=0.13.",
    "figure_path": "figures/step_2_candidate_4_region.png"
  },
  {
    "step_index": 105,
    "title": "Candidate 5 region",
    "description": "Local pblock built around path 7; result WNS=0.055.",
    "figure_path": "figures/step_2_candidate_5_region.png"
  },
  {
    "step_index": 200,
    "title": "Candidate WNS comparison",
    "description": "WNS achieved by each candidate after place, optional phys-opt, and route.",
    "figure_path": "figures/step_3_candidate_wns.png"
  },
  {
    "step_index": 201,
    "title": "Candidate delta WNS",
    "description": "Improvement of each candidate relative to the original checkpoint.",
    "figure_path": "figures/step_4_candidate_improvement.png"
  },
  {
    "step_index": 202,
    "title": "Best candidate selection",
    "description": "Final chosen path and local pblock region.",
    "figure_path": "figures/step_5_best_candidate.png"
  }
];
let idx = 0;
let timer = null;
let delayMs = 1200;

function render() {
  const s = steps[idx];
  document.getElementById("stepLabel").textContent = `Step ${s.step_index} of $15`;
  document.getElementById("title").textContent = s.title;
  document.getElementById("desc").textContent = s.description;
  document.getElementById("img").src = s.figure_path;
  document.getElementById("slider").value = idx;
}

function setStep(i) {
  idx = Math.max(0, Math.min(i, steps.length - 1));
  render();
}

function nextStep() {
  idx = (idx + 1) % steps.length;
  render();
}

function prevStep() {
  idx = (idx - 1 + steps.length) % steps.length;
  render();
}

function tick() {
  nextStep();
}

function togglePlay() {
  const btn = document.getElementById("playBtn");
  if (timer) {
    clearInterval(timer);
    timer = null;
    btn.textContent = "Play";
  } else {
    timer = setInterval(tick, delayMs);
    btn.textContent = "Pause";
  }
}

function updateSpeed() {
  delayMs = parseInt(document.getElementById("speedSel").value);
  if (timer) {
    clearInterval(timer);
    timer = setInterval(tick, delayMs);
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") nextStep();
  if (e.key === "ArrowLeft") prevStep();
  if (e.key === " ") {
    e.preventDefault();
    togglePlay();
  }
});

render();
</script>
</body>
</html>
